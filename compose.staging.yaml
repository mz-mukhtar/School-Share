name: schoolshare-staging

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${STAGING_APP_KEY:?Set STAGING_APP_KEY in .env.staging; never reuse production secrets}
  APP_URL: http://schoolshare.example:18080
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: schoolshare_staging
  DB_USERNAME: schoolshare
  DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
  CACHE_STORE: file
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: "false"
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_SCHEME: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: staging@schoolshare.test
  MAIL_FROM_NAME: SchoolShare Staging

services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: schoolshare_staging
      MYSQL_USER: schoolshare
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set STAGING_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mariadb:
    image: mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    environment:
      MARIADB_DATABASE: schoolshare_staging
      MARIADB_USER: schoolshare
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set STAGING_DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mariadb-cpanel:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: schoolshare_staging
      MARIADB_USER: schoolshare
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?Set STAGING_DB_ROOT_PASSWORD}
    volumes:
      - cpanel-mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_ENABLE_CHAOS: "true"
    ports:
      - "127.0.0.1:18025:8025"
    restart: unless-stopped
  app:
    build:
      context: .
      target: production
    image: schoolshare-staging-app:local
    environment: *app-environment
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  app-mariadb:
    image: schoolshare-staging-app:local
    environment:
      <<: *app-environment
      APP_URL: http://schoolshare.example:18081
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - mariadb-app-storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  app-cpanel:
    image: schoolshare-staging-app:local
    environment:
      <<: *app-environment
      APP_URL: http://schoolshare.example:18082
      DB_CONNECTION: mariadb
      DB_HOST: mariadb-cpanel
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - cpanel-app-storage:/var/www/html/storage
    depends_on:
      mariadb-cpanel:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  test:
    profiles: [test]
    build:
      context: .
      target: testing
    image: schoolshare-staging-test:local
    user: www-data
    working_dir: /workspace
    environment:
      <<: *app-environment
      APP_ENV: testing
      DB_DATABASE: schoolshare_testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
    volumes:
      - .:/workspace:ro
      - ./.env.staging.example:/workspace/.env:ro
      - test-storage:/workspace/storage
      - test-bootstrap:/workspace/bootstrap/cache
    entrypoint: [php, artisan]
    command: [test, --compact]
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
  scheduler:
    image: schoolshare-staging-app:local
    user: www-data
    environment: *app-environment
    command: [php, artisan, schedule:work, --no-interaction]
    healthcheck:
      disable: true
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  mariadb-data:
  cpanel-mariadb-data:
  app-storage:
  mariadb-app-storage:
  cpanel-app-storage:
  test-storage:
  test-bootstrap:
